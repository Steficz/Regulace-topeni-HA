# AUTO-GENEROVANO z scripts/gen-zone.py — ruka jen do zdrojoveho vzoru
- alias: "Vyt J2: box zadava ventil"
  triggers:
    - trigger: mqtt
      topic: "vyt/j2/valve"
  actions:
    - choose:
        - conditions: "{{ trigger.payload == 'ON' }}"
          sequence: [{action: switch.turn_on, target: {entity_id: switch.vyt_j2}}]
        - conditions: "{{ trigger.payload == 'OFF' }}"
          sequence: [{action: switch.turn_off, target: {entity_id: switch.vyt_j2}}]
  mode: queued

- alias: "Vyt: TTL heartbeat J2"
  triggers:
    - trigger: state
      entity_id: sensor.vyt_j2_teplota
      to: "unavailable"
      for: "00:10:00"
  actions:
    - action: switch.turn_off
      target: {entity_id: switch.vyt_j2}
    - action: persistent_notification.create
      data:
        notification_id: vyt_offline_j2
        title: "Vytápění J2 offline"
        message: "Box J2 se 10 min neozývá — ventil vypnut. Zkontroluj napájení/Wi-Fi."

